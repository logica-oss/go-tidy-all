name: Release

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Lets the release action create tags and GitHub releases
      pull-requests: read # Reads the pull requests that the release notes link to
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create release
        id: release
        uses: logica-oss/actions-toolkit/release@77e65c475dd7833ec935ab63662cf418b7ac323e # v1.2.5
        with:
          initial-version: v0.1.0
          create-release: "false"

  goreleaser:
    name: GoReleaser
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Lets GoReleaser upload the release assets
      id-token: write # Lets attest mint an OIDC token for Sigstore signing
      attestations: write # Lets attest persist the provenance attestation
    env:
      GORELEASER_VERSION: "v2.20.1"
      SYFT_VERSION: "v1.57.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Syft
        id: syft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          install_dir="$(mktemp -d "${RUNNER_TEMP}/syft-bin.XXXXXX")"
          cd "${install_dir}"

          gh release download "${SYFT_VERSION}" --repo anchore/syft \
            --pattern "syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" \
            --pattern "syft_${SYFT_VERSION#v}_checksums.txt"

          tarball="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          grep " ${tarball}$" "syft_${SYFT_VERSION#v}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" syft

          echo "cmd=${install_dir}/syft" >> "${GITHUB_OUTPUT}"
      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: dirname "${SYFT_CMD}" >> "${GITHUB_PATH}"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve checksums file
        id: checksums
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(./dist/*_checksums.txt)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one checksums file in ./dist, found ${#files[@]}" >&2
            exit 1
          fi

          echo "path=${files[0]}" >> "${GITHUB_OUTPUT}"
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.checksums.outputs.path }}
